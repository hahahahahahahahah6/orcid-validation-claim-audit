[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orcid-validation-claim-audit"
version = "0.1.0"
description = "Offline audit of documented researcher-identifier claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
orcid-validation-claim-audit = "orcid_validation_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["orcid_validation_claim_audit*"]
